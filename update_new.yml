---
- name: Execute Initial Setup Commands
  hosts: localhost
  become: true
  gather_facts: true

  vars:
    fastfetch_arch_map:
      x86_64: amd64
      aarch64: arm64

  tasks:
    # --- New Check: Verify if this is a cloud-init system ---
    - name: Check if cloud-init is present on the system
      ansible.builtin.stat:
        path: /etc/cloud
      register: cloud_init_dir

    - name: Ensure necessary directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /etc/systemd/system/getty@tty1.service.d
        - /etc/systemd/journald.conf.d

    # --- Conditional: Only run if /etc/cloud exists ---
    - name: Add cloud-init wait configuration
      ansible.builtin.blockinfile:
        path: /etc/systemd/system/getty@tty1.service.d/cloud-init_wait.conf
        create: true
        mode: '0644'
        marker: "# {mark} ANSIBLE MANAGED BLOCK - cloud-init wait"
        block: |
          [Unit]
          After=cloud-final.service
      when: cloud_init_dir.stat.exists

    - name: Install system package dependencies
      ansible.builtin.apt:
        name:
          - 7zip
          - bat
          - build-essential
          - cowsay
          - duf
          - fd-find
          - fortune-mod
          - fzf
          - iftop
          - libpam-modules
          - libpam-modules-bin
          - locales
          - micro
          - needrestart
          - net-tools
          - python3
          - python3-docker
          - python3-pip
          - python3-venv
          - unzip
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Check if fastfetch is available in repositories
      ansible.builtin.command: apt-cache show fastfetch
      register: fastfetch_check
      failed_when: false
      changed_when: false

    - name: Try installing fastfetch from distro repo
      ansible.builtin.apt:
        name: fastfetch
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: fastfetch_check.rc == 0
      register: fastfetch_repo_install

    - name: Install fastfetch from GitHub release when repo package is unavailable
      when: fastfetch_check.rc != 0 or (fastfetch_repo_install is defined and fastfetch_repo_install is failed)
      block:
        - name: Determine architecture mapping
          ansible.builtin.set_fact:
            fastfetch_arch: "{{ fastfetch_arch_map[ansible_architecture] | default('') }}"

        - name: Validate supported architecture
          ansible.builtin.fail:
            msg: "Unsupported architecture for fastfetch release: {{ ansible_architecture }}"
          when: fastfetch_arch == ''

        - name: Fetch latest fastfetch release metadata
          ansible.builtin.uri:
            url: https://api.github.com/repos/fastfetch-cli/fastfetch/releases/latest
            return_content: true
            headers:
              Accept: application/vnd.github+json
              User-Agent: ansible-provisioning
            status_code: 200
          register: fastfetch_release
          until: fastfetch_release.status == 200
          retries: 3
          delay: 5

        - name: Install fastfetch package directly from URL
          ansible.builtin.apt:
            deb: "{{ (fastfetch_release.json.assets | selectattr('name', 'contains', fastfetch_arch + '.deb') | map(attribute='browser_download_url') | first) }}"
            state: present

    - name: Configure needrestart automatic restarts
      ansible.builtin.lineinfile:
        path: /etc/needrestart/needrestart.conf
        regexp: '^\s*#?\s*\$nrconf\{restart\}\s*='
        line: "$nrconf{restart} = 'a';"
        state: present
        create: true
        backup: true

    - name: Configure journald retention limits
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/99-limits.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [Journal]
          SystemMaxUse=200M
          SystemKeepFree=500M
          MaxRetentionSec=14day

    - name: Configure system-wide screenrc
      ansible.builtin.blockinfile:
        path: /etc/screenrc
        create: true
        mode: '0644'
        marker: "# {mark} ANSIBLE MANAGED BLOCK - screenrc"
        block: |
          startup_message off
          nethack on
          vbell_msg ''
          termcapinfo *  vb=:
          altscreen on
          bindkey -k up send-up
          bindkey -k dn send-down

    - name: Get list of interactive user homes
      ansible.builtin.find:
        paths: /home
        file_type: directory
        recurse: false
      register: user_dirs

    - name: Set existing user and root home directory list
      ansible.builtin.set_fact:
        target_homes: "{{ user_dirs.files | map(attribute='path') | list + ['/root'] }}"

    - name: Set shell configuration home directory list
      ansible.builtin.set_fact:
        shell_config_homes: "{{ target_homes + ['/etc/skel'] }}"

    - name: Deploy .inputrc to existing users, root, and skel
      ansible.builtin.template:
        src: inputrc.j2
        dest: "{{ item }}/.inputrc"
        owner: "{{ 'root' if item in ['/root', '/etc/skel'] else (item | basename) }}"
        group: "{{ 'root' if item in ['/root', '/etc/skel'] else (item | basename) }}"
        mode: '0644'
      loop: "{{ shell_config_homes }}"

    - name: Ensure .local/share directory exists for existing users and root
      ansible.builtin.file:
        path: "{{ item }}/.local/share"
        state: directory
        owner: "{{ 'root' if item == '/root' else (item | basename) }}"
        group: "{{ 'root' if item == '/root' else (item | basename) }}"
        mode: '0755'
      loop: "{{ target_homes }}"

    - name: Configure .bashrc additions for existing users, root, and skel
      ansible.builtin.blockinfile:
        path: "{{ item }}/.bashrc"
        create: true
        owner: "{{ 'root' if item in ['/root', '/etc/skel'] else (item | basename) }}"
        group: "{{ 'root' if item in ['/root', '/etc/skel'] else (item | basename) }}"
        mode: '0644'
        marker: "# {mark} ANSIBLE MANAGED BLOCK - MOTD + fzf helper"
        block: "{{ lookup('ansible.builtin.template', 'bashrc-additions.j2') }}"
      loop: "{{ shell_config_homes }}"

    - name: Disable cloud-init on full Virtual Machines
      ansible.builtin.file:
        path: /etc/cloud/cloud-init.disabled
        state: touch
        owner: root
        group: root
        mode: '0644'
      when:
        - cloud_init_dir.stat.exists
        - ansible_virtualization_type not in ["docker", "container", "lxc", "podman", "openvz", "systemd-nspawn"]
        - ansible_virtualization_role != "guest" or ansible_virtualization_type == "kvm"
