
---
- name: Docker Installation Playbook (Docker official repo)
  hosts: localhost
  become: true

  tasks:
    - name: Verify supported distribution
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution in ['Ubuntu', 'Debian']
        fail_msg: "Unsupported Linux distribution"

    - name: Remove conflicting Docker packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-compose-v2
          - docker-doc
          - docker-buildx
          - podman-docker
          - containerd
          - runc
        state: absent
        fail_on_autoremove: true

    - name: Install prerequisites
      ansible.builtin.apt:
        update_cache: true
        name:
          - ca-certificates
          - curl
          - python3-debian
        state: present

    - name: Create APT keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Configure Docker APT repository
      ansible.builtin.deb822_repository:
        name: docker
        types:
          - deb
        uris:
          - "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
        suites:
          - "{{ ansible_facts.distribution_release }}"
        components:
          - stable
        architectures:
          - "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'} .get(ansible_facts.architecture, ansible_facts.architecture) }}"
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
        enabled: true

    - name: Update APT cache after adding Docker repository
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is running and enabled
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Verify Docker Engine
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Verify Docker Compose
      ansible.builtin.command:
        cmd: docker compose version
      register: compose_version
      changed_when: false

    - name: Display installed versions
      ansible.builtin.debug:
        msg:
          - "{{ docker_version.stdout }}"
          - "{{ compose_version.stdout }}"
