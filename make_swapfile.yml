---
- name: Configure swap
  hosts: all
  become: true
  gather_facts: true

  vars:
    swap_file: /swapfile
    swap_size: 2G

  tasks:
    - name: Check whether swap file exists
      ansible.builtin.stat:
        path: "{{ swap_file }}"
      register: swapfile

    - name: Create swap file
      ansible.builtin.command:
        cmd: "fallocate -l {{ swap_size }} {{ swap_file }}"
      when: not swapfile.stat.exists
      changed_when: true

    - name: Set swap file permissions
      ansible.builtin.file:
        path: "{{ swap_file }}"
        owner: root
        group: root
        mode: "0600"

    - name: Check whether swap file is formatted
      ansible.builtin.command:
        cmd: "blkid -s TYPE -o value {{ swap_file }}"
      register: swapfile_type
      changed_when: false
      failed_when: false

    - name: Format swap file
      ansible.builtin.command:
        cmd: "mkswap {{ swap_file }}"
      when: swapfile_type.stdout != "swap"
      changed_when: true

    - name: Check whether swap file is active
      ansible.builtin.command:
        cmd: swapon --show=NAME --noheadings
      register: active_swap
      changed_when: false

    - name: Enable swap file
      ansible.builtin.command:
        cmd: "swapon {{ swap_file }}"
      when: swap_file not in active_swap.stdout_lines
      changed_when: true

    - name: Make swap persistent in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^/swapfile\s+'
        line: '/swapfile none swap sw 0 0'
        state: present
        backup: true